<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선대칭 도형 제비뽑기 · 친구 그림 완성</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#e8f6ff;--card:#fff;--tx:#2b3a55;--mu:#7b93b3;--ac:#3b82f6;--ok:#16a34a;--bad:#ff5a7a;--ln:#ffd166;--gr:#fff4c2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}


*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 14px 14px,#ffffffaa 3px,transparent 4px) 0 0/44px 44px,linear-gradient(180deg,#bfe6ff,#ffeaf4 55%,#fff7cc);background-attachment:fixed;color:var(--tx);font-family:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:1.7rem;margin:.3em 0;text-align:center;color:#ff6b8b;text-shadow:2px 2px 0 #fff,4px 4px 0 #ffd166}h2{font-size:1.25rem;margin:0 0 8px;color:#3b82f6}
.card{background:var(--card);border:3px solid var(--ln);border-radius:24px;padding:16px;margin:14px 0;box-shadow:0 6px 0 #ffd16655}
.steps{display:flex;gap:6px;margin:10px 0}.steps span{flex:1;text-align:center;font-size:.85rem;padding:8px 2px;border-radius:999px;background:#fff;border:2px dashed #b9d4f5;color:var(--mu)}
.steps .on{background:#ff8fab;border:2px solid #ff6b8b;color:#fff;transform:scale(1.06);box-shadow:0 3px 0 #ff6b8b88}
button{font:inherit;font-size:1.05rem;border:0;border-radius:16px;padding:11px 18px;background:var(--ac);color:#fff;cursor:pointer;margin:4px 4px 6px 0;box-shadow:0 4px 0 #2159b8}button:active{transform:translateY(3px);box-shadow:0 1px 0 #2159b8}
button.s{background:#fff1a8;color:#8a5a00;box-shadow:0 4px 0 #e0bd4a}
#tS{background:#c8f3d2;color:#0f6b2f;box-shadow:0 4px 0 #7fd397}#tS.on{background:#2fb457;color:#fff;box-shadow:0 4px 0 #1b7f3b}
#tT{background:#ffdcc2;color:#a8470a;box-shadow:0 4px 0 #f2a874}#tT.on{background:#ff8a3d;color:#fff;box-shadow:0 4px 0 #c75d14}
body.teacher{background:radial-gradient(circle at 14px 14px,#ffffffaa 3px,transparent 4px) 0 0/44px 44px,linear-gradient(180deg,#ffd9b8,#fff0e0 55%,#fff7cc);background-attachment:fixed}
body.teacher .card{border-color:#ffb07a;box-shadow:0 6px 0 #ffb07a55}body.teacher h2{color:#e8731a}button:disabled{opacity:.4;cursor:default}
input{font:inherit;padding:10px;border:3px solid #b9d4f5;border-radius:14px;background:#fff;color:var(--tx);width:45%;margin-bottom:8px}
canvas{width:100%;max-width:480px;touch-action:none;border-radius:20px;border:4px solid #ffd166;background:#fff;display:block;margin:10px auto;box-shadow:0 6px 0 #ffd16655}
.tabs{display:flex;gap:6px}.mu{color:var(--mu);font-size:.85rem}.big{font-size:1.4rem;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{border-bottom:1px solid var(--ln);padding:5px;text-align:left}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
</style></head><body><main>
<h1>🦒 선대칭 도형 제비뽑기 ✨</h1>
<div class="tabs"><button id="tS" class="s">학생</button><button id="tT" class="s">🔑 선생님</button></div>
<div id="app"></div>
<p class="mu" id="mode"></p>
</main>
<script>
const W=12,H=10,C=36,M=24;
const MIS=[['하트','v'],['나비','v'],['집','v'],['나무','v'],['별','v'],['로켓','h'],['물고기','h'],['배','h'],['리본','h']].map(([n,a])=>({n,a}));
const AX={v:'세로 대칭축 (왼쪽 반쪽을 그려요)',h:'가로 대칭축 (위쪽 반쪽을 그려요)'};
const ok1=(a,x,y,q)=>a==='v'?(q?x>=W/2:x<=W/2):(q?y>=H/2:y<=H/2);
const mir=(a,s)=>a==='v'?[W-s[0],s[1],W-s[2],s[3]]:[s[0],H-s[1],s[2],H-s[3]];
const key=s=>[s[0]+','+s[1],s[2]+','+s[3]].sort().join('|');
let S={subs:{},assign:{}},db=null,local=true,owner=false,tab='S';
let me=null,mission=null,segs=[],pend=null,quiz=null,mine=[],checked=null,fin=false;
const LK='symm-v2';
try{S=JSON.parse(localStorage.getItem(LK))||S}catch(e){}
const $=id=>document.getElementById(id);
function say(t){let d=$('toast');if(!d){d=document.createElement('div');d.id='toast';d.style.cssText='position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:99;max-width:90%;text-align:center';document.body.appendChild(d)}d.textContent=t;d.style.display='block';clearTimeout(d._t);d._t=setTimeout(()=>d.style.display='none',3500)}
async function put(col,id,d){S[col][id]=d;let ok=true;if(db){try{await db.collection(col).doc(id).set(d)}catch(e){ok=false;delete S[col][id];say('저장하지 못했어요. 다시 시도해 주세요.')}}else{try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}}render();return ok}
async function del(col,id){delete S[col][id];if(db){try{await db.collection(col).doc(id).delete()}catch(e){}}else{try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}}}
(async()=>{
 try{
  const t=new Promise(r=>setTimeout(()=>r(null),4000));
  const u=await Promise.race([claude.use('user'),t]);owner=u?u.isOwner():false;
  db=await Promise.race([claude.use('db'),t]);
 }catch(e){db=null}
 if(db){local=false;S={subs:{},assign:{}};
  for(const c of ['subs','assign'])db.collection(c).onSnapshot(sn=>{S[c]={};sn.docs.forEach(d=>S[c][d.id]=d.data());render()},()=>{});}
 $('mode').textContent=local?'이 기기 안에서만 저장돼요. (한 대의 기기로 수업할 때 사용)':'모든 학생의 제출이 공유돼요.';
 render();
})();
let tOK=false,lock=false;try{lock=sessionStorage.getItem('symm-lock')==='1'}catch(e){}
$('tS').onclick=()=>{tab='S';if(!tOK&&!lock){lock=true;try{sessionStorage.setItem('symm-lock','1')}catch(e){}}render()};
$('tT').onclick=()=>{tab='T';render()};
const cv=document.createElement('canvas');cv.width=W*C+2*M;cv.height=H*C+2*M;
const px=(x,y)=>[M+x*C,M+y*C];
function paint(o){
 const g=cv.getContext('2d'),cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim(),a=o.a;
 g.clearRect(0,0,cv.width,cv.height);
 g.fillStyle=v('--gr');
 const [x0,y0]=px(0,0);
 if(a==='v'){if(o.q)g.fillRect(px(W/2,0)[0],y0,W/2*C,H*C);else g.fillRect(x0,y0,W/2*C,H*C)}
 else{if(o.q)g.fillRect(x0,px(0,H/2)[1],W*C,H/2*C);else g.fillRect(x0,y0,W*C,H/2*C)}
 g.fillStyle=v('--mu');
 for(let i=0;i<=W;i++)for(let j=0;j<=H;j++){const[p,q]=px(i,j);g.fillRect(p-1.5,q-1.5,3,3)}
 g.strokeStyle=v('--bad');g.lineWidth=2;g.setLineDash([8,6]);g.beginPath();
 if(a==='v'){g.moveTo(px(W/2,0)[0],y0-10);g.lineTo(px(W/2,0)[0],px(0,H)[1]+10)}else{g.moveTo(x0-10,px(0,H/2)[1]);g.lineTo(px(W,0)[0]+10,px(0,H/2)[1])}
 g.stroke();g.setLineDash([]);
 const L=(arr,col,dash)=>{g.strokeStyle=col;g.lineWidth=3.5;g.lineCap='round';g.setLineDash(dash?[6,5]:[]);arr.forEach(s=>{g.beginPath();g.moveTo(...px(s[0],s[1]));g.lineTo(...px(s[2],s[3]));g.stroke()});g.setLineDash([])};
 if(o.ghost)L(o.ghost,v('--bad'),1);
 L(o.fixed||[],v('--ac'));L(o.mine||[],v('--ok'));
 if(o.pend){g.fillStyle=v('--ok');g.beginPath();g.arc(...px(...o.pend),7,0,7);g.fill()}
}
let cur=null;
cv.onpointerdown=e=>{
 if(!cur||!cur.edit)return;
 const r=cv.getBoundingClientRect(),k=cv.width/r.width;
 const x=Math.round(((e.clientX-r.left)*k-M)/C),y=Math.round(((e.clientY-r.top)*k-M)/C);
 if(x<0||y<0||x>W||y>H||!ok1(cur.a,x,y,cur.q))return;
 const P=cur.arr;
 if(!pend)pend=[x,y];else if(pend[0]===x&&pend[1]===y)pend=null;else{P.push([pend[0],pend[1],x,y]);pend=[x,y]}
 render();
};
function ui(o){cur=o;o.pend=pend;paint(o)}
function stepBar(n){return '<div class="steps">'+['1 제비뽑기','2 반쪽 제출','3 친구 배정','4 대칭 완성'].map((t,i)=>`<span class="${i+1===n?'on':''}">${t}</span>`).join('')+'</div>'}
function render(){
 const A=$('app');$('tT').textContent=(lock&&!tOK)?'🔒 선생님':'🔑 선생님';$('tS').textContent='🎒 학생';$('tS').classList.toggle('on',tab==='S');$('tT').classList.toggle('on',tab==='T'&&tOK);document.body.className=(tab==='T'&&tOK)?'teacher':'';
 if(tab==='T'){if(!tOK)return gate(A);return teacher(A)}
 if(!me){
  A.innerHTML=stepBar(1)+'<div class="card"><h2>🙋 누구인가요?</h2><input id="n1" inputmode="numeric" placeholder="번호"> <input id="n2" placeholder="이름"><br><button id="go">🎉 시작하기</button></div>';
  $('go').onclick=()=>{const n=$('n1').value.trim(),m=$('n2').value.trim();if(!n||!m)return say('번호와 이름을 입력해 주세요.');me={id:'n'+n,num:n,name:m};quiz=null;mine=[];checked=null;const s=S.subs[me.id];if(s){mission=s.mission;segs=s.segs}else{mission=null;segs=[]}pend=null;render()};
  return;
 }
 const sub=S.subs[me.id],as=S.assign[me.id];
 if(as&&sub){ // step 4
  const t=S.subs[as.target];
  if(!t){A.innerHTML=stepBar(4)+'<div class="card">배정된 그림을 찾지 못했어요. 선생님께 알려 주세요.</div>';return}
  const a=t.mission.a;
  A.innerHTML=stepBar(4)+`<div class="card"><h2>4단계 · 대칭 완성 퀴즈</h2><p>친구 그림의 나머지 반쪽을 그려요.<br><span class="mu">${t.mission.n} · ${AX[a]==='' ? '' : (a==='v'?'세로 대칭축 (오른쪽 반쪽을 그려요)':'가로 대칭축 (아래쪽 반쪽을 그려요)')}</span></p></div><div id="cw"></div><div class="card"><p class="mu">대응점은 대칭축에서 같은 거리, 반대쪽에 있어요.</p><button id="u" class="s">되돌리기</button><button id="c" class="s">모두 지우기</button><button id="chk">✅ 정답 확인</button><div id="res"></div></div>`;
  $('cw').appendChild(cv);
  const ans=t.segs.map(s=>mir(a,s));
  ui({a,q:1,edit:!checked,arr:mine,fixed:t.segs,mine,ghost:checked?ans:null});
  $('u').onclick=()=>{mine.pop();pend=null;checked=null;render()};
  $('c').onclick=()=>{mine.length=0;pend=null;checked=null;render()};
  $('chk').onclick=()=>{pend=null;const A2=new Set(ans.map(key)),B=new Set(mine.map(key));let hit=0;A2.forEach(k=>{if(B.has(k))hit++});const extra=[...B].filter(k=>!A2.has(k)).length;checked={hit,tot:A2.size,extra};render()};
  if(checked){const c=checked,all=c.hit===c.tot&&!c.extra;$('res').innerHTML=`<p class="${all?'ok':'bad'} big">${all?'완벽해요! 🎉':'다시 살펴봐요'}</p><p>맞은 선 ${c.hit} / ${c.tot}${c.extra?` · 잘못 그린 선 ${c.extra}개`:''}</p><p class="mu">${all?'':'빨간 점선이 대칭축에 대해 같은 거리에 있는 정답이에요.'}</p>`}
  return;
 }
 if(sub){
  A.innerHTML=stepBar(sub?3:2)+`<div class="card"><h2>제출이 완료되었습니다 ✅</h2><p>${me.name}의 그림이 제출되었어요. 제출 후에는 수정할 수 없어요.<br>선생님이 친구 그림을 배정하면 4단계가 열려요.</p><button id="rf" class="s">배정 확인하기</button></div><div id="cw"></div>`;
  $('cw').appendChild(cv);ui({a:mission.a,fixed:segs,edit:false});$('rf').onclick=()=>render();return;
 }
 // steps 1-2
 A.innerHTML=stepBar(mission?2:1)+`<div class="card"><h2>${mission?'2단계 · 반쪽 그림 그리기':'1단계 · 미션 제비뽑기'}</h2>${mission?`<p><b class="big">${mission.n}</b><br><span class="mu">${AX[mission.a]}</span></p><p class="mu">점을 차례로 눌러 선을 이어요. 같은 점을 한 번 더 누르면 선이 끊겨요.</p>`:'<button id="dr">🎲 제비 뽑기!</button>'}</div>${mission?'<div id="cw"></div><div class="card"><button id="u" class="s">되돌리기</button><button id="c" class="s">모두 지우기</button><button id="sb">🚀 제출하기</button><p class="mu">제출 후에는 수정할 수 없어요.</p></div>':''}`;
 if(!mission){$('dr').onclick=()=>{mission=MIS[Math.floor(Math.random()*MIS.length)];render()};return}
 $('cw').appendChild(cv);ui({a:mission.a,edit:true,arr:segs,mine:segs});
 $('u').onclick=()=>{segs.pop();pend=null;render()};$('c').onclick=()=>{segs.length=0;pend=null;render()};
 $('sb').onclick=async()=>{if(!segs.length)return say('먼저 그림을 그려 주세요.');pend=null;const ok=await put('subs',me.id,{num:me.num,name:me.name,mission,segs});if(ok)say('제출이 완료되었습니다.')};
}
function gate(A){
 A.innerHTML='<div class="card"><h2>🔑 선생님 확인</h2><p class="mu">비밀번호를 입력해 주세요.</p><input id="pw" type="password" inputmode="numeric" placeholder="비밀번호"> <button id="pk">확인</button></div>';
 const go=()=>{if($('pw').value.trim()==='54'){tOK=true;render()}else{say('비밀번호가 틀렸어요.');$('pw').value=''}};
 $('pk').onclick=go;$('pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
function teacher(A){
 const ids=Object.keys(S.subs),as=S.assign,done=Object.keys(as).length>0;
 A.innerHTML=`<div class="card"><h2>선생님 · 제출 현황 (${ids.length}명)</h2><table><tr><th>번호</th><th>이름</th><th>미션</th><th>배정</th></tr>${ids.map(i=>{const s=S.subs[i],t=as[i]&&S.subs[as[i].target];return `<tr><td>${s.num}</td><td>${s.name}</td><td>${s.mission.n}</td><td>${t?t.name+'의 그림':'-'}</td></tr>`}).join('')||'<tr><td colspan=4 class="mu">아직 제출이 없어요.</td></tr>'}</table></div>
 <div class="card"><h2>3단계 · 친구 그림 랜덤 배정</h2><p class="mu">모두 제출한 뒤 눌러 주세요. 자기 그림은 배정되지 않아요.</p><button id="as" ${ids.length<2?'disabled':''}>${done?'다시 배정하기':'배정하기'}</button><button id="rs" class="s">전체 초기화</button></div>`;
 $('as').onclick=async()=>{let t;do{t=[...ids].sort(()=>Math.random()-.5)}while(t.some((x,i)=>x===ids[i]));for(let i=0;i<ids.length;i++)await put('assign',ids[i],{target:t[i]})};
 $('rs').onclick=async()=>{if(!window._rc){window._rc=1;say('한 번 더 누르면 모든 제출이 지워져요.');setTimeout(()=>window._rc=0,4000);return}window._rc=0;for(const i of Object.keys(S.subs))await del('subs',i);for(const i of Object.keys(S.assign))await del('assign',i);me=null;render()};
}
</script></body></html>
